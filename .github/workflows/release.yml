name: Release

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build shadowJar
        run: ./gradlew --no-daemon shadowJar

      # ----- Compute next semver tag (push or manual dispatch) -----
      - name: Compute next semver tag
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        id: ver
        run: |
          set -eu
          # Last semver tag (vX.Y.Z), default to v0.0.0 if none yet
          last=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          last=${last:-v0.0.0}
          ver=${last#v}
          IFS='.' read -r MAJOR MINOR PATCH <<<"$ver"

          bump="${{ github.event.inputs.bump || 'patch' }}"
          case "$bump" in
            major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR+1)); PATCH=0 ;;
            patch) PATCH=$((PATCH+1)) ;;
            *) echo "unknown bump: $bump"; exit 1 ;;
          esac

          new="v${MAJOR}.${MINOR}.${PATCH}"
          echo "last=$last"
          echo "new=$new"
          echo "tag=$new" >> "$GITHUB_OUTPUT"
          echo "version=${MAJOR}.${MINOR}.${PATCH}" >> "$GITHUB_OUTPUT"

      - name: Create auto-release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          body: |
            Automated release from commit `${{ github.sha }}`.

            **Latest-release jar URL** (always points at newest release):
            `https://github.com/OnThePixel-net/PixelLimbo/releases/latest/download/pixellimo.jar`

            Direct download for this version:
            `https://github.com/OnThePixel-net/PixelLimbo/releases/download/${{ steps.ver.outputs.tag }}/pixellimo.jar`
          files: build/libs/pixellimo.jar
          fail_on_unmatched_files: true
          make_latest: true

      # ----- Manual release trigger: just attach the jar -----
      - name: Attach jar to existing release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/pixellimo.jar
          fail_on_unmatched_files: true
